<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06070c;--p:#0c0e17;--p2:#151a2b;--bd:#1d2336;--tx:#e8ebf6;--mu:#8790aa;--ac:#8f7dff;--acx:#07080d;--dg:#ff6b81;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(900px 480px at 65% -12%,color-mix(in srgb,var(--ac) 16%,transparent),transparent),var(--bg);color:var(--tx);font:15px "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{--sw:248px;height:100%;display:grid;grid-template-columns:var(--sw) minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr) auto;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));transition:grid-template-columns .25s}
.app.col{--sw:76px}
.side,.main,.info{background:linear-gradient(180deg,var(--p),#090b12);border:1px solid var(--bd);border-radius:20px;min-height:0;overflow:auto}
.side{padding:14px 10px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 12px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 200deg,var(--ac),#3fe0ff,var(--ac));box-shadow:0 0 18px color-mix(in srgb,var(--ac) 55%,transparent);flex:none}
.brand .wm{height:76px;width:auto;display:block;flex:none;margin-right:auto;user-select:none;-webkit-user-drag:none}
.brand .mk{height:30px;width:auto;display:none;flex:none;user-select:none;-webkit-user-drag:none}.brand .mk.alw{display:block}
.app.col .brand{flex-direction:column;padding:2px 0 12px;gap:8px}.app.col .brand .wm{display:none}.app.col .brand .mk{display:block}
.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;border-radius:12px;color:var(--mu);font-weight:600;position:relative;transition:background .2s,color .2s}
.nav:hover{background:var(--p2);color:var(--tx)}
.nav.on{background:var(--p2);color:var(--tx)}.nav.on::before{content:"";position:absolute;left:-10px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--ac);box-shadow:0 0 10px var(--ac)}
.nav .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nav small{color:var(--mu);font-weight:400}
.nav .art{width:28px;height:28px;border-radius:8px}
.sub{color:var(--mu);font-size:13px;padding:14px 10px 4px}
.pls{display:flex;flex-direction:column;gap:2px}.grow{flex:1}
.app.col .t,.app.col small,.app.col .sub,.app.col .brand b{display:none}.app.col .nav,.app.col .btn.mk{justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ac);color:var(--acx);border-radius:999px;padding:10px 18px;font-weight:600;transition:filter .2s,transform .15s}
.btn:hover:not(:disabled){filter:brightness(1.12)}.btn:active:not(:disabled){transform:scale(.97)}
.ghost{background:var(--p2);color:var(--tx);border:1px solid var(--bd)}.dgb{background:var(--dg)}
.ic{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;color:var(--mu);transition:color .2s,background .2s,transform .15s;position:relative}
.ic:hover:not(:disabled){color:var(--tx);background:var(--p2)}.ic:active{transform:scale(.9)}.ic.on{color:var(--ac)}.ic.fv{color:var(--ac)}.ic.fv svg{fill:currentColor}
.top{position:sticky;top:0;z-index:5;display:flex;gap:10px;padding:14px 24px;background:color-mix(in srgb,var(--p) 80%,transparent);backdrop-filter:blur(14px)}
.sb{flex:1;display:flex;align-items:center;gap:8px;background:var(--p2);border:1px solid var(--bd);border-radius:999px;padding:0 14px;color:var(--mu);max-width:520px}
.sb:focus-within{border-color:var(--ac)}.sb input{flex:1;min-width:0;background:none;border:0;padding:10px 0;outline:none}
#view{padding:6px 24px 28px}#view.enter{animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}
h1,.title{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.1}
h2{font-size:21px;letter-spacing:-.02em;margin:26px 0 12px}
.title{background:none;border:0;width:100%;padding:2px 0;border-bottom:2px solid transparent}.title:hover,.title:focus{border-bottom-color:var(--bd);outline:none}
.meta{color:var(--mu);margin-top:4px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;margin:10px 0 16px}.head>div:first-child{flex:1;min-width:200px}
.phead{display:flex;gap:22px;align-items:flex-end;margin:-6px -24px 16px;padding:24px;background:linear-gradient(180deg,hsl(var(--h) 60% 45%/.4),transparent)}
.cover{width:190px;height:190px;flex:none;border-radius:18px;position:relative;overflow:hidden;box-shadow:0 14px 40px #0008}.cover .art{width:100%;height:100%;border-radius:0}
.cover:hover::after,.cover:focus-visible::after{content:"Cambiar portada";position:absolute;inset:0;background:#000a;display:grid;place-items:center;font-weight:600}
.dsc{width:100%;background:none;border:0;border-bottom:2px solid transparent;resize:none;color:var(--mu);padding:2px 0;margin-top:4px}.dsc:hover,.dsc:focus{border-bottom-color:var(--bd);outline:none}
.sw{display:flex;gap:8px;margin:10px 0}.sw button{width:22px;height:22px;border-radius:50%;background:hsl(var(--h) 70% 52%);border:2px solid transparent}.sw button.on{border-color:var(--tx)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.art{display:block;width:44px;height:44px;border-radius:10px;flex:none;background:linear-gradient(135deg,hsl(var(--h) 72% 58%),hsl(calc(var(--h) + 55) 70% 30%));background-size:cover;background-position:center}
.row{display:grid;grid-template-columns:30px 44px minmax(0,1fr) auto 36px 36px;gap:12px;align-items:center;padding:6px 8px;border-radius:12px;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 56px}
.row:hover{background:var(--p2)}.row.on{background:var(--p2)}.row.on .nm{color:var(--ac)}.row.ov{box-shadow:0 -2px 0 var(--ac)}
.ix{display:grid;place-items:center;color:var(--mu);font-variant-numeric:tabular-nums}.eq{display:none;gap:2px;align-items:flex-end;height:14px}.eq i{width:3px;height:100%;background:var(--ac);border-radius:2px;transform-origin:bottom;transform:scaleY(.3)}
.row.on .eq{display:flex}.row.on .ix b{display:none}body.pl .eq i{animation:eq .9s ease-in-out infinite}.eq i:nth-child(2){animation-delay:.2s!important}.eq i:nth-child(3){animation-delay:.4s!important}
@keyframes eq{50%{transform:scaleY(1)}}
.mn{min-width:0}.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ar{color:var(--mu);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.du{color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:168px;gap:16px;overflow-x:auto;padding-bottom:8px}
.card{cursor:pointer;min-width:0}.card .cw{position:relative;margin-bottom:8px}.card .art{width:100%;height:auto;aspect-ratio:1;border-radius:14px;transition:transform .25s}.card:hover .art{transform:translateY(-3px)}
.card .pl{position:absolute;right:8px;bottom:8px;width:42px;height:42px;border-radius:50%;background:var(--ac);color:var(--acx);display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:.2s;box-shadow:0 6px 18px #0008}
.card:hover .pl,.card:focus-within .pl,.card:focus-visible .pl{opacity:1;transform:none}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.qt{display:flex;align-items:center;gap:12px;background:var(--p2);border:1px solid var(--bd);border-radius:12px;overflow:hidden;cursor:pointer;font-weight:600;padding-right:10px}.qt:hover{border-color:var(--ac)}.qt .art{width:54px;height:54px;border-radius:0}
.empty{max-width:440px;margin:60px auto;text-align:center;color:var(--mu);line-height:1.55}.empty h2{color:var(--tx);margin:0 0 8px}.empty .btn{margin-top:16px}
.warn{background:var(--p2);border-radius:12px;padding:10px 14px;margin:8px 0;color:var(--dg)}
.setg{background:var(--p2);border:1px solid var(--bd);border-radius:16px;padding:6px 18px;max-width:640px}.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--bd)}.set:last-child{border:0}.set small{display:block;color:var(--mu)}
.set input[type=text],.set select{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
.set .sw{margin:0}.set .sw button{background:var(--c)}
.sk{height:56px;border-radius:12px;margin:8px 0;background:linear-gradient(90deg,var(--p2),#1b2135,var(--p2));background-size:200% 100%;animation:sh 1.2s linear infinite}@keyframes sh{to{background-position:-200% 0}}
.info{width:0;padding:0;border-width:0;transition:width .25s}.app.io .info{width:320px;padding:18px;border-width:1px}
.info .art{width:100%;height:auto;aspect-ratio:1;border-radius:16px;margin:12px 0}.info dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:12px 0;color:var(--mu)}.info dd{margin:0;color:var(--tx);text-align:right}
.player{grid-column:1/-1;background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--bd);border-radius:20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,1.5fr) minmax(0,1fr);gap:16px;align-items:center;padding:10px 18px}
.now{display:flex;align-items:center;gap:12px;min-width:0}.now .art{width:56px;height:56px;border-radius:12px;box-shadow:0 6px 18px #0008}
.ctl{display:flex;flex-direction:column;gap:4px;align-items:center}.btns{display:flex;align-items:center;gap:4px}
.play{width:46px;height:46px;border-radius:50%;background:var(--ac);color:var(--acx);display:grid;place-items:center;transition:transform .15s,box-shadow .3s}.play:hover:not(:disabled){transform:scale(1.06)}body.pl .play{box-shadow:0 0 22px color-mix(in srgb,var(--ac) 60%,transparent)}
#rep[data-m="2"]::after{content:"1";position:absolute;font-size:9px;font-weight:800;top:9px;right:8px}
.seek{display:flex;gap:10px;align-items:center;width:100%}.seek span{font-size:12px;color:var(--mu);min-width:36px;font-variant-numeric:tabular-nums}.seek span:last-child{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:9px;background:linear-gradient(90deg,var(--ac) var(--v,0%),#2a3148 0);flex:1;min-width:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.vol{display:flex;gap:4px;align-items:center;justify-content:flex-end}.vol input{max-width:96px}
.pop{position:fixed;z-index:30;background:var(--p2);border:1px solid var(--bd);border-radius:14px;padding:6px;min-width:230px;max-width:300px;max-height:70vh;overflow:auto;box-shadow:0 14px 40px #000a;animation:in .15s}
.pop button{display:flex;gap:8px;width:100%;text-align:left;padding:9px 10px;border-radius:8px}.pop button:hover{background:var(--bd)}.pop .ck{width:16px;color:var(--ac)}.pop hr{border:0;border-top:1px solid var(--bd);margin:6px 0}.pop .dg{color:var(--dg)}.pop .cap{color:var(--mu);font-size:13px;padding:6px 10px}
dialog{background:var(--p2);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:22px;width:min(440px,92vw);max-height:80vh}dialog::backdrop{background:#000a;backdrop-filter:blur(4px)}
dialog h3{margin:0 0 6px;font-size:20px}dialog p{color:var(--mu);margin:0 0 12px}dialog label{display:block;color:var(--mu);font-size:13px;margin:10px 0}dialog input{display:block;width:100%;margin-top:4px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;color:var(--tx)}dialog .acts{justify-content:flex-end;margin-top:16px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:40;align-items:center;pointer-events:none}
#toast div{background:var(--p2);border:1px solid var(--ac);border-radius:999px;padding:10px 18px;animation:in .25s;box-shadow:0 8px 24px #000a}#toast .err{border-color:var(--dg)}
[data-motion="0"] *,[data-motion="0"] *::before,[data-motion="0"] *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:900px){.app.io .info{position:fixed;z-index:25;inset:8px;width:auto}}
@media (max-width:760px){
.app,.app.col{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto;--sw:0}
.side{grid-row:3;flex-direction:row;overflow:auto hidden;padding:6px;gap:2px;justify-content:space-around}.side>*{flex:none}.brand,.sub,.pls,.btn.mk,.nav .t,.nav small,.grow{display:none}.nav{width:auto;padding:10px 14px}.nav.on::before{left:14px;right:14px;top:auto;bottom:2px;width:auto;height:3px}
.player{grid-row:2;grid-template-columns:1fr;gap:4px;padding:8px 12px}.vol,#qb,#ib{display:none}.now{order:-1}
.top{padding:10px 14px}.btn span{display:none}#view{padding:6px 14px 20px}.phead{flex-direction:column;align-items:flex-start;margin:-6px -14px 14px;padding:16px 14px}.cover{width:150px;height:150px}h1,.title{font-size:26px}
.row{grid-template-columns:26px 44px minmax(0,1fr) auto 36px}.row .du{display:none}.row .ic:nth-last-child(2){display:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.tabs{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}.tabs button{padding:8px 16px;border-radius:999px;background:var(--p2);border:1px solid var(--bd);color:var(--mu);font-weight:600;transition:.2s}.tabs button.on{background:var(--ac);color:var(--acx);border-color:transparent}
.bar{position:sticky;top:64px;z-index:4;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--p2);border:1px solid var(--ac);border-radius:16px;padding:8px 12px;margin:8px 0;box-shadow:0 8px 24px #0008}.bar b{margin-right:auto}
.row .ix input{accent-color:var(--ac);width:16px;height:16px;margin:0}
</style>
</head>

<div class="app" id="app">
  <nav class="side" id="side" aria-label="Navegación principal"></nav>
  <main class="main" id="main">
    <div class="top"><label class="sb"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><input id="q" type="search" placeholder="Buscar canciones, artistas o playlists ( / )" aria-label="Buscar" autocomplete="off"></label><button class="btn" data-a="add" title="Agregar música" aria-label="Agregar música"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Agregar música</span></button></div>
    <div id="view"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  </main>
  <aside class="info" id="info" aria-label="Información de la canción"></aside>
  <section class="player" aria-label="Reproductor">
    <div class="now" id="now"></div>
    <div class="ctl">
      <div class="btns"><button class="ic" id="shuf" title="Aleatorio" aria-label="Aleatorio"></button><button class="ic" id="prev" title="Anterior" aria-label="Anterior"></button><button class="play" id="pp" title="Reproducir o pausar (Espacio)" aria-label="Reproducir o pausar"></button><button class="ic" id="next" title="Siguiente" aria-label="Siguiente"></button><button class="ic" id="rep" title="Repetir: desactivado" aria-label="Repetir"></button></div>
      <div class="seek"><span id="cur">0:00</span><input type="range" id="sk" min="0" max="1000" value="0" aria-label="Posición"><span id="tot">0:00</span></div>
    </div>
    <div class="vol"><button class="ic" id="qb" title="Cola de reproducción" aria-label="Cola de reproducción"></button><button class="ic" id="ib" title="Información de la canción" aria-label="Información"></button><button class="ic" id="mb" title="Opciones de la canción" aria-label="Opciones de la canción"></button><button class="ic" id="mu" title="Silenciar" aria-label="Silenciar"></button><input type="range" id="vl" min="0" max="1" step="0.01" value="0.8" aria-label="Volumen"></div>
  </section>
</div>
<input type="file" id="fi" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac,.aac,.opus" multiple hidden>
<input type="file" id="cfi" accept="image/*" hidden>
<input type="file" id="jfi" accept="application/json,.json" hidden>
<div id="pop" class="pop" hidden></div><dialog id="dlg"></dialog><div id="toast" role="status" aria-live="polite"></div>

const A={
  tab:a=>{libTab=a.dataset.t;renderView()},sel:()=>{sel=sel?null:new Set();renderView()},selx:()=>{sel=null;renderView()},selall:()=>{sel=new Set(ctx);renderView()},
  selq:()=>{const ids=[...sel];if(!ids.length)return;if(!queue.length)playFrom(ids,ids[0]);else{const c=curId();ids.forEach(i=>{if(i!==c){queue=queue.filter(x=>x!==i);queue.push(i)}});qi=queue.indexOf(c);orig=cfg.shuf?[...orig.filter(x=>!ids.includes(x)||x===c),...ids.filter(x=>x!==c)]:queue.slice();SV('q',{ids:queue,cur:c})}toast(ids.length+' canciones en la cola');sel=null;renderAll()},
  selpl:a=>{const ids=[...sel];if(!ids.length)return toast('Selecciona canciones primero');openMenu(a,()=>[{cap:'Añadir a playlist'},...lists.map(x=>({t:esc(x.name),fn:()=>{const add=ids.filter(i=>!x.ids.includes(i));x.ids.push(...add);saveList(x);toast(add.length+' añadidas'+(ids.length>add.length?` · ${ids.length-add.length} ya estaban`:''));sel=null;renderAll()}})),{sep:1},{t:'＋ Nueva playlist',fn:async()=>{const n=lists.length;await newList(ids[0]);if(lists.length>n){const l=lists[lists.length-1];l.ids=[...new Set([...l.ids,...ids])];saveList(l);sel=null;renderAll()}}}])},
  selfav:()=>{const ids=[...sel];if(!ids.length)return;const all=ids.every(i=>favs.has(i));ids.forEach(i=>all?favs.delete(i):favs.add(i));SV('fav',[...favs]);toast(all?'Quitadas de favoritas':'Añadidas a favoritas');renderAll()},
  seldel:async()=>{const ids=[...sel];if(!ids.length)return;if(!await ask('Eliminar '+ids.length+' canciones','Se borrarán de tu biblioteca y de todas las playlists. No se puede deshacer.',{ok:'Eliminar',dg:1}))return;for(const i of ids)await delSongAsk(i,'q');sel=null;renderAll();toast(ids.length+' canciones eliminadas')},
  add:()=>$('#fi').click(),col:()=>{$('#app').classList.toggle('col');cfg.col=$('#app').classList.contains('col');SV('cfg',cfg)},newlist:()=>newList(),closeinfo:()=>{$('#app').classList.remove('io');renderInfo()},
  fav:(a,id)=>toggleFav(id),pfav:()=>curId()&&toggleFav(curId()),menu:(a,id)=>openMenu(a,()=>songMenu(id)),
  rm:(a,id)=>{const i=queue.indexOf(id);if(i<0||i===qi)return;queue.splice(i,1);if(i<qi)qi--;orig=orig.filter(x=>x!==id);SV('q',{ids:queue,cur:curId()});renderView();renderInfo()},
  playall:()=>{if(ctx.length)playFrom(ctx,ctx[0])},shufall:()=>{if(!ctx.length)return;cfg.shuf=true;SV('cfg',cfg);playFrom(ctx,ctx[Math.floor(Math.random()*ctx.length)])},
  cover:()=>{const l=listOf();coverTarget={type:'list',id:l.id};$('#cfi').click()},uncover:()=>{coverTarget={type:'list',id:listOf().id};setCover(null)},
  hue:a=>{const l=listOf();l.hue=+a.dataset.hue;saveList(l);renderAll()},addsongs:()=>addSongsDlg(listOf()),
  dellist:async()=>{const l=listOf();if(!await ask('Eliminar playlist','Se eliminará «'+esc(l.name)+'». Las canciones seguirán en tu biblioteca.',{ok:'Eliminar',dg:1}))return;lists=lists.filter(x=>x.id!==l.id);delList(l.id);go('all');toast('Playlist eliminada')},
  onlyfav:()=>{onlyFav=!onlyFav;renderView()},clearq:()=>{const c=curId();queue=c?[c]:[];orig=queue.slice();qi=c?0:-1;renderView();renderInfo()},
  clearhist:async()=>{if(!await ask('Limpiar historial','Se borrarán las reproducciones registradas.',{ok:'Limpiar',dg:1}))return;hist=[];SV('hist',hist);renderView();toast('Historial limpiado')},
  acc:a=>{cfg.accent=a.dataset.c;SV('cfg',cfg);applyCfg();renderView()},exp:exportJSON,imp:()=>$('#jfi').click(),
  reset:async()=>{if(!await ask('Restablecer ajustes','Volverán los ajustes originales. Tu música, playlists y favoritos no se tocan.',{ok:'Restablecer',dg:1}))return;cfg={...DEF};SV('cfg',cfg);applyCfg();renderAll();toast('Ajustes restablecidos')}
};
$('#main').addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){if(g.dataset.lt)libTab=g.dataset.lt;go(g.dataset.go);return}
  const a=e.target.closest('[data-a]'),host=e.target.closest('[data-id]'),id=host&&host.dataset.id;
  if(a){const f=A[a.dataset.a];if(a.dataset.a==='cplay'){e.stopPropagation();const l=!!host&&host.dataset.k==='l'?lists.find(x=>x.id===id):null;if(l){const ids=l.ids.filter(byId);if(ids.length)playFrom(ids,ids[0]);else toast('La playlist está vacía')}else{const n=shelves[+host.dataset.n]||[id];playFrom(n,id)}return}if(f)f(a,id);return}
  if(host&&host.classList.contains('card')){if(host.dataset.k==='l')go('l:'+id);else playFrom(shelves[+host.dataset.n]||[id],id);return}
  if(host&&host.classList.contains('row')){if(sel){sel.has(id)?sel.delete(id):sel.add(id);renderView();return}if(view==='queue')play(id);else playFrom(ctx.includes(id)?ctx:[id],id)}
});
$('#main').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('card'))e.target.click();if(e.target.id==='ttl'&&e.key==='Enter')e.target.blur()});
$('#info').addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a)A[a.dataset.a]();const r=e.target.closest('[data-q]');if(r)play(r.dataset.id)});
$('#side').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.v)go(b.dataset.v);else if(b.dataset.a)A[b.dataset.a]()});
$('#main').addEventListener('change',e=>{
  const l=listOf(),t=e.target;
  if(t.id==='ttl'&&l){l.name=t.value.trim()||'Sin nombre';saveList(l);renderSide()}
  else if(t.id==='dsc'&&l){l.desc=t.value.trim();saveList(l)}
  else if(t.id==='srt'){sort=t.value;renderView()}
  else if(t.id==='sname'){cfg.name=t.value.trim()||DEF.name;SV('cfg',cfg);renderSide()}
  else if(t.id==='smo'){cfg.motion=+t.value;SV('cfg',cfg);applyCfg()}
  else if(t.id==='sdup'){cfg.skipdup=t.checked;SV('cfg',cfg)}
});
let qt;$('#q').addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(()=>view==='search'?renderView():go('search'),120)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.blur()}});
$('#fi').addEventListener('change',e=>{addFiles([...e.target.files]);e.target.value=''});
$('#jfi').addEventListener('change',e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value=''});
$('#cfi').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f&&f.type.startsWith('image'))setCover(await shrink(f))});
// arrastrar y soltar: importar archivos y reordenar filas
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files.length)addFiles([...e.dataTransfer.files])});
const rowOf=e=>e.target.closest('.row[draggable]');
$('#view').addEventListener('dragstart',e=>{const r=rowOf(e);if(!r)return;dg=+r.dataset.i;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','fila')});
$('#view').addEventListener('dragover',e=>{if(dg<0)return;e.preventDefault();document.querySelectorAll('.row.ov').forEach(r=>r.classList.remove('ov'));rowOf(e)?.classList.add('ov')});
$('#view').addEventListener('dragend',()=>{dg=-1;document.querySelectorAll('.row.ov').forEach(r=>r.classList.remove('ov'))});
$('#view').addEventListener('drop',e=>{
  const r=rowOf(e);if(!r||dg<0)return;e.preventDefault();const to=+r.dataset.i,from=dg;dg=-1;if(from===to)return;
  const arr=ctx.slice(),[x]=arr.splice(from,1);arr.splice(to,0,x);
  if(view==='queue'){const c=curId();queue=arr;qi=queue.indexOf(c);if(!cfg.shuf)orig=queue.slice();SV('q',{ids:queue,cur:c})}
  else{const l=listOf();if(l){l.ids=arr;saveList(l)}}
  renderView();renderInfo()
});
addEventListener('keydown',e=>{
  const t=e.target,typing=/INPUT|TEXTAREA|SELECT/.test(t.tagName)&&t.type!=='range'&&t.type!=='checkbox';
  if(((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')||(!typing&&e.key==='/')){e.preventDefault();$('#q').focus();return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey||$('#dlg').open)return;
  if(e.code==='Space'&&t.tagName!=='BUTTON'){e.preventDefault();toggle()}
  else if(e.key==='ArrowRight'&&t.type!=='range'){e.preventDefault();e.shiftKey?step(1):au.currentTime=Math.min(au.duration||0,au.currentTime+5)}
  else if(e.key==='ArrowLeft'&&t.type!=='range'){e.preventDefault();e.shiftKey?prev():au.currentTime=Math.max(0,au.currentTime-5)}
  else if(e.key==='ArrowUp'&&t.type!=='range'){e.preventDefault();au.volume=Math.min(1,au.volume+.05);rng($('#vl'),au.volume)}
  else if(e.key==='ArrowDown'&&t.type!=='range'){e.preventDefault();au.volume=Math.max(0,au.volume-.05);rng($('#vl'),au.volume)}
  else if(e.key.toLowerCase()==='f'&&curId())toggleFav(curId());
  else if(e.key==='Escape')closeMenu()
});
function applyCfg(){document.documentElement.style.setProperty('--ac',cfg.accent);document.documentElement.dataset.motion=cfg.motion;$('#app').classList.toggle('col',!!cfg.col);document.title=(curSong()?curSong().title+' · ':'')+cfg.name}
// ---- Arranque ----
(async()=>{
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  try{songs=(await tx('songs','readonly',o=>o.getAll()))||[];lists=(await tx('lists','readonly',o=>o.getAll()))||[]}catch(e){ok=false}
  songs.sort((a,b)=>a.added-b.added);songs.forEach(s=>sm.set(s.id,s));lists.forEach(l=>{if(!Array.isArray(l.ids))l.ids=[]});
  favs=new Set([...favs].filter(byId));au.volume=cfg.vol;rng($('#vl'),cfg.vol);applyCfg();
  const q=LS('q',null),rt=LS('qt',0);if(q&&Array.isArray(q.ids)){queue=q.ids.filter(byId);orig=queue.slice();if(byId(q.cur)&&queue.includes(q.cur)){play(q.cur,false);if(rt)au.addEventListener('loadedmetadata',()=>{au.currentTime=rt},{once:true})}}
  renderAll();go('home')
})();
</script>
</body>
